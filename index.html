<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game de Vendas - Operação Multiverso</title>
    <style>
        /* RESET E FONTES */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: #ecf0f1; display: flex; height: 100vh; overflow: hidden; }

        :root { --gold: #f1c40f; --dark-bg: #1a1a1a; --panel-bg: rgba(20, 20, 20, 0.95); --green: #27ae60; --red: #c0392b; }

        /* --- BARRA LATERAL COM RECOLHIMENTO --- */
        .sidebar { width: 280px; flex-shrink: 0; background-color: var(--dark-bg); padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 100; box-shadow: 5px 0 20px rgba(0,0,0,1); border-right: 2px solid #333; transition: margin-left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .sidebar.collapsed { margin-left: -280px; }
        
        .panel { background: var(--panel-bg); border: 1px solid #333; border-left: 4px solid var(--gold); border-radius: 5px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .panel h3 { color: var(--gold); font-size: 12px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px;}
        
        .avatar-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar-icon { font-size: 20px; background: #2c3e50; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 10px; border: 2px solid var(--gold); overflow: hidden; }
        .avatar-icon img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-info { flex: 1; font-size: 11px; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #f39c12); width: 0%; transition: width 1s; }

        /* --- RESPONSIVIDADE PARA TELAS MENORES --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 35vh; border-right: none; border-bottom: 2px solid #333; flex-direction: row; flex-wrap: wrap; overflow-y: auto; transition: margin-top 0.4s ease; }
            .sidebar.collapsed { margin-left: 0; margin-top: -35vh; }
            .panel { flex: 1; min-width: 150px; }
            .map-viewport { height: 65vh; }
        }

        /* --- VIEWPORT DO MAPA --- */
        .map-viewport { flex: 1; position: relative; overflow: hidden; background-color: #111; }
        .map-content { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background-image: url('https://i.postimg.cc/Nfsx9QGF/paisagem-de-zona-de-guerra-com-destruicao-apocaliptica-23-2150985648.avif'); background-color: #222; background-size: 100% 100%; background-repeat: no-repeat; background-position: center; transition: background-image 1s ease-in-out; }

        .btn-toggle { position: absolute; top: 20px; left: 20px; z-index: 90; background: rgba(0,0,0,0.8); border: 2px solid var(--gold); color: var(--gold); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: 0.2s; }
        .btn-toggle:hover { background: var(--gold); color: #000; }

        .floating-banner { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 2px solid var(--gold); padding: 10px 30px; border-radius: 30px; text-align: center; z-index: 200; backdrop-filter: blur(5px); transition: all 0.5s;}
        .floating-banner h1 { font-size: 16px; color: white; margin-bottom: 2px; text-transform: uppercase;}
        .floating-banner p { font-size: 11px; color: var(--gold); font-weight: bold;}
        .screen-timer { position: absolute; bottom: 0; left: 0; height: 5px; background: var(--gold); width: 0%; transition: width 1s linear; z-index: 300; }

        /* SVG PATH STYLING */
        .svg-path { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        
        /* NODES (BASES) REDUZIDAS */
        .node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 10; transition: all 0.5s; }
        .node-icon { font-size: 24px; background: rgba(20,20,20,0.8); width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 2px solid #7f8c8d; box-shadow: 0 3px 10px rgba(0,0,0,0.9); transition: all 0.5s;}
        .node-label { background: rgba(0,0,0,0.9); padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; margin-top: 5px; border: 1px solid #7f8c8d; white-space: nowrap; pointer-events: none; }
        .node.castle .node-icon { border: 3px solid var(--gold); background: rgba(241, 196, 15, 0.4); font-size: 35px; box-shadow: 0 0 20px var(--gold); width: 65px; height: 65px;}

        /* PLACAS DE AVISO MENORES */
        .warning-sign { position: absolute; transform: translate(-50%, -50%); z-index: 8; background: rgba(0, 0, 0, 0.85); border: 1px solid #7f8c8d; border-left: 3px solid var(--red); color: #ecf0f1; padding: 4px; border-radius: 4px; font-size: 8px; font-weight: bold; text-align: center; width: 85px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); pointer-events: none; }
        .warning-sign span { display: block; color: var(--gold); font-size: 9px; margin-bottom: 2px; border-bottom: 1px solid #333; padding-bottom: 2px; }

        .player-token { position: absolute; transform: translate(-50%, -100%); z-index: 15; transition: all 1.5s ease-in-out; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .player-token:hover { z-index: 50; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .player-token .icon { font-size: 45px; background: #fff; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--green); display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.9); animation: float 3s ease-in-out infinite; overflow: hidden; }
        .player-token .icon img { width: 100%; height: 100%; object-fit: cover; }
        .player-token .bubble { background: white; color: black; font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 8px; border: 2px solid black; margin-bottom: 5px; white-space: nowrap; pointer-events: none; text-align: center;}

        #tooltip { position: fixed; display: none; background: rgba(15, 20, 25, 0.95); border: 1px solid var(--gold); padding: 15px; border-radius: 8px; color: white; font-size: 13px; z-index: 1000; pointer-events: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); min-width: 150px; }
        #tooltip h4 { color: var(--gold); margin-bottom: 5px; font-size: 14px;}
        #tooltip hr { border-color: #444; margin: 8px 0; }
        #loader { text-align:center; color: var(--gold); font-size: 11px; margin-top: 10px; font-weight: bold; background: #222; padding: 5px; border-radius: 5px; display: none;}

        /* TELA DE COMEMORAÇÃO EXTREMA (SHOW DO MILHÃO) */
        #level-up-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }
        .level-up-avatar-container {
            font-size: 120px; background: #fff; width: 300px; height: 300px; border-radius: 50%;
            border: 15px solid var(--green); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 100px rgba(46, 204, 113, 0.8), 0 20px 50px rgba(0,0,0,1); overflow: hidden;
        }
        .level-up-avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .level-up-text {
            color: var(--gold); font-size: 40px; margin-top: 30px; text-transform: uppercase;
            font-weight: bold; text-shadow: 0 5px 15px rgba(0,0,0,1); text-align: center; max-width: 90%;
        }

        @keyframes decolagemAviator {
            0% { transform: scale(0.1) translateY(800px); opacity: 0; }
            15% { transform: scale(1.1) translateY(-20px); opacity: 1; }
            25% { transform: scale(1) translateY(0); opacity: 1; }
            70% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.4) translateY(-1500px) translateX(800px) rotate(45deg); opacity: 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    // --- FUNÇÃO PARA RECOLHER E ABRIR O PAINEL ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const btnShow = document.getElementById('btn-show-sidebar');
        if (sidebar.classList.contains('collapsed')) {
            sidebar.classList.remove('collapsed');

    const somAviao = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-200.wav');
    somPalmas.volume = 0.7;

    function iniciarAtivacaoAudio() {
        somPalmas.play().then(() => { somPalmas.pause(); somPalmas.currentTime = 0; }).catch(e => {});

    const tooltip = document.getElementById('tooltip');

    // Matematica do Novo Caminho Orgânico
    function getPosicaoNoMapa(pontosNaFase) {
        let maxIndex = caminhoCurvo.length - 1;
        if (pontosNaFase <= 0) return { x: caminhoCurvo[0].x, y: caminhoCurvo[0].y };
        if (pontosNaFase >= TAMANHO_FASE) return { x: caminhoCurvo[maxIndex].x, y: caminhoCurvo[maxIndex].y };
        
        let step = TAMANHO_FASE / maxIndex; 

        for (let i = 0; i < maxIndex; i++) {
            let atualPts = i * step; 
            let proxPts = (i+1) * step;
            if (pontosNaFase >= atualPts && pontosNaFase < proxPts) {
                let perc = (pontosNaFase - atualPts) / step;
                return { x: caminhoCurvo[i].x + ((caminhoCurvo[i+1].x - caminhoCurvo[i].x) * perc), y: caminhoCurvo[i].y + ((caminhoCurvo[i+1].y - caminhoCurvo[i].y) * perc) };
            }
        }
    }

        overlay.style.display = 'flex';
        iconContainer.style.animation = 'decolagemAviator 5s forwards cubic-bezier(0.25, 1, 0.5, 1)';
        textContainer.style.animation = 'fadeIn 1s forwards';

        somPalmas.currentTime = 0;
        somPalmas.play().catch(e => console.log('Áudio aguardando clique.', e));

        setTimeout(() => {
            somAviao.currentTime = 0;
            somAviao.play().catch(e => console.log('Áudio aguardando clique.', e));
        }, 1200);

        setTimeout(() => { overlay.style.display = 'none'; }, 5500);
    }

    async function carregarDadosDoServidor() {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';

        if(API_URL === "SUA_URL_AQUI" || API_URL.trim() === "") {
            loader.className = 'error-msg'; loader.innerText = "COLE SUA API_URL NO CÓDIGO!";
            
            jogadores = [
                { nome: "SILVA", avatar: "🪖", pontosTotais: 750 }, 
                { nome: "ADRIANA VITORELLI", avatar: mapaAvatares["ADRIANA VITORELLI"], pontosTotais: 1950 }
            ];
            processarEstatisticasEquipe();
            return;
        }

        loader.className = ''; loader.innerText = "Sincronizando placar...";
        
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Erro de Rede");
            
            const jsonResposta = await response.json();
            const vendas = jsonResposta.vendasHoje || [];
            let somaVendedoresTemp = {};
            
            let dataHojeLocal = new Date();
            dataHojeLocal.setHours(0,0,0,0);
            
            vendas.forEach(venda => {
                let nome = venda[0] ? venda[0].toString().toUpperCase().trim() : null;
                let valor = Math.floor(parseFloat(venda[1]) || 0); 
                let dataVendaStr = venda[2] ? venda[2].toString().trim() : "";
                
                if(!nome || valor <= 0) return; 

                let dataVendaObj = new Date(0);
                if(dataVendaStr !== "") {
                    if (dataVendaStr.includes('/')) {
                        let partes = dataVendaStr.split('/');
                        if (partes.length === 3) { dataVendaObj = new Date(partes[2], partes[1] - 1, partes[0]); }
                    } else if (dataVendaStr.includes('-')) {
                        let baseData = dataVendaStr.split('T')[0];
                        let partes = baseData.split('-');
                        if (partes.length === 3) { dataVendaObj = new Date(partes[0], partes[1] - 1, partes[2]); }
                    }
                }
                dataVendaObj.setHours(0,0,0,0);
                
                if(dataVendaObj.getTime() >= dataHojeLocal.getTime()) {
                    if(!somaVendedoresTemp[nome]) somaVendedoresTemp[nome] = 0;
                    somaVendedoresTemp[nome] += valor;
                }
            });

            jogadores = Object.keys(somaVendedoresTemp).map(nomeConsultor => {
                return {
                    nome: nomeConsultor,
                    avatar: mapaAvatares[nomeConsultor] || "👤",
                    pontosTotais: somaVendedoresTemp[nomeConsultor]
                };
            });
            
            loader.className = 'success-msg'; loader.innerText = "Atualizado!";

        } catch (e) {
            console.error(e);
            loader.className = 'error-msg'; loader.innerText = "ERRO: Verifique a conexão.";
        } finally {
            processarEstatisticasEquipe();
            setTimeout(() => { loader.style.display = 'none'; }, 3000);
        }
    }

    function processarEstatisticasEquipe() {
        maxFaseAlcancada = 1;
        jogadores.forEach(jog => {
            let f = Math.floor(Math.max(0, jog.pontosTotais - 0.01) / TAMANHO_FASE) + 1;
            jog.fase = f;
            jog.pontosNaFaseAtual = jog.pontosTotais - ((f - 1) * TAMANHO_FASE);
            if(f > maxFaseAlcancada) maxFaseAlcancada = f;

            let marcosBateu = Math.floor(jog.pontosTotais / TAMANHO_FASE); 
            
            if(!primeiroCarregamento && marcosAnteriores[jog.nome] !== undefined && marcosBateu > marcosAnteriores[jog.nome]) {
                dispararAnimacaoAvanco(jog);
            }
            
            marcosAnteriores[jog.nome] = marcosBateu;
        });

        primeiroCarregamento = false;

        atualizarPainelLateral();
        renderizarMapaAtual();
    }

    function atualizarPainelLateral() {
        const lista = document.getElementById('avatar-list');
        lista.innerHTML = '';
        let equipeTotal = 0;

        jogadores.sort((a,b) => b.pontosTotais - a.pontosTotais).forEach(jog => {
            equipeTotal += jog.pontosTotais;
            let progressoPercent = Math.min((jog.pontosNaFaseAtual / TAMANHO_FASE) * 100, 100);
            let recompensasPagas = Math.floor(jog.pontosTotais / TAMANHO_FASE) * 20;

            lista.innerHTML += `
                <div class="avatar-item" onmouseenter="showTooltip(event, '${jog.nome}', 'Total Geral (Hoje): ${jog.pontosTotais} PTS<br>Recompensa Acumulada: <b>R$ ${recompensasPagas},00</b><br><br>Faltam: ${TAMANHO_FASE - jog.pontosNaFaseAtual} pts p/ próxima meta')" onmouseleave="hideTooltip()">
                    <div class="avatar-icon">${jog.avatar}</div>
                    <div class="avatar-info">
                        <div style="display:flex; justify-content: space-between; color: white;">
                            <b>${jog.nome}</b> <span style="color:var(--gold); font-weight:bold;">FASE ${jog.fase}</span>
                        </div>
                        <div style="font-size: 10px; color: #aaa;">${jog.pontosNaFaseAtual.toFixed(0)} / ${TAMANHO_FASE}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressoPercent}%;"></div></div>
                    </div>
                </div>`;
        });
        document.getElementById('score-team-txt').innerText = `${equipeTotal} PTS`;
    }

    function renderizarMapaAtual() {
        const mapContent = document.getElementById('map-content');
        const containerNos = document.getElementById('nodes-container');
        containerNos.innerHTML = ''; 
        document.querySelectorAll('.player-token').forEach(el => el.remove()); 

        // DESENHA A LINHA CURVA DO MAPA AUTOMATICAMENTE
        const pathString = "M " + caminhoCurvo.map(p => p.x + " " + p.y).join(" L ");
        document.getElementById('map-path').setAttribute("d", pathString);

        const tema = (faseExibicaoAtual % 2 === 0) ? TEMAS.par : TEMAS.impar;
        mapContent.style.backgroundImage = tema.bg;
        document.getElementById('banner-title').innerText = `${tema.titulo} (FASE ${faseExibicaoAtual})`;

        // RENDERIZA AS BASES PRINCIPAIS BASEADAS NOS INDICES (0, 4, 8, 12, 16, 20)
        tema.nos.forEach((noConfig, index) => {
            const pos = caminhoCurvo[index * 4];
            const isCastle = index === 5; 
            const el = document.createElement('div');
            el.className = `node unlocked ${isCastle ? 'castle' : ''}`;
            el.style.left = `${pos.x}%`; el.style.top = `${pos.y}%`;
            el.innerHTML = `<div class="node-icon">${noConfig.icone}</div><div class="node-label">${noConfig.nome}</div>`;
            containerNos.appendChild(el);
        });

        // RENDERIZA AS PLACAS DE AVISO (ESPALHADAS)
        PLACAS_AVISO.forEach(placa => {
            const pos = getPosicaoNoMapa(placa.pts);
            const el = document.createElement('div');
            el.className = 'warning-sign';
            el.style.left = `${pos.x}%`; el.style.top = `${pos.y}%`;
            el.innerHTML = `<span>⚠️ ${placa.pts} PTS</span>${placa.texto}`;
            containerNos.appendChild(el);
        });

        // RENDERIZA OS AVATARES NA TRILHA CURVA
        jogadores.forEach(jog => {
            if(jog.fase !== faseExibicaoAtual) return;
            let pos = getPosicaoNoMapa(jog.pontosNaFaseAtual);
            let randomX = (Math.random() * 40) - 20; let randomY = (Math.random() * 40) - 20;

            const token = document.createElement('div');
            token.className = 'player-token';
            token.style.left = `calc(${pos.x}% + ${randomX}px)`; token.style.top = `calc(${pos.y}% + ${randomY}px)`;
            token.onmouseenter = (e) => showTooltip(e, `Consultor: ${jog.nome}`, `Total Geral: ${jog.pontosTotais}<br>Progresso Fase ${jog.fase}: <b>${jog.pontosNaFaseAtual}</b>`);
            token.onmouseleave = hideTooltip;
            token.innerHTML = `<div class="bubble">${jog.nome} (${jog.pontosNaFaseAtual})</div><div class="icon" style="animation-delay: ${Math.random()}s;">${jog.avatar}</div>`;
            mapContent.appendChild(token);
        });
    }

    function loopTelas() {
        if(maxFaseAlcancada > 1) {
            timerLoop += 1; 
            document.getElementById('screen-timer').style.width = `${(timerLoop / 8) * 100}%`;
            if(timerLoop >= 8) { 
                timerLoop = 0; document.getElementById('screen-timer').style.width = '0%';
                faseExibicaoAtual++;
                if(faseExibicaoAtual > maxFaseAlcancada) faseExibicaoAtual = 1; 
                renderizarMapaAtual();
            }
        } else {
            faseExibicaoAtual = 1; document.getElementById('screen-timer').style.width = '100%';
        }
    }
    
    // GATILHOS DE ATUALIZAÇÃO
    setInterval(loopTelas, 1000); 
    setInterval(carregarDadosDoServidor, 60000); // RECARREGA OS DADOS AUTOMATICAMENTE A CADA 1 MINUTO

    window.onload = () => {
        renderizarMapaAtual(); 
        carregarDadosDoServidor(); 
    };

</script>
</body>
</html>
