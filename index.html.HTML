<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game de Vendas - Operação Multiverso</title>
    <style>
        /* RESET E FONTES */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: #ecf0f1; display: flex; height: 100vh; overflow: hidden; }

        :root { --gold: #f1c40f; --dark-bg: #1a1a1a; --panel-bg: rgba(20, 20, 20, 0.95); --green: #27ae60; --red: #c0392b; }

        /* --- BARRA LATERAL --- */
        .sidebar { width: 340px; background-color: var(--dark-bg); padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 100; box-shadow: 5px 0 20px rgba(0,0,0,1); border-right: 2px solid #333; }
        .panel { background: var(--panel-bg); border: 1px solid #333; border-left: 4px solid var(--gold); border-radius: 5px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .panel h3 { color: var(--gold); font-size: 13px; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px;}
        
        .avatar-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .avatar-icon { font-size: 24px; background: #2c3e50; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 10px; border: 2px solid var(--gold); overflow: hidden; }
        .avatar-icon img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-info { flex: 1; font-size: 12px; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #f39c12); width: 0%; transition: width 1s; }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .controls input, .controls select, .controls button { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; font-size: 14px; }
        .controls button { background: var(--gold); border: none; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .controls button:hover { background: #f39c12; transform: scale(1.02); }

        /* --- VIEWPORT DO MAPA (TELA CHEIA) --- */
        .map-viewport { flex: 1; position: relative; overflow: hidden; background-color: #111; }

        /* CONTAINER DO MAPA DINÂMICO */
        .map-content {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background-image: url('https://i.postimg.cc/Nfsx9QGF/paisagem-de-zona-de-guerra-com-destruicao-apocaliptica-23-2150985648.avif');
            background-color: #222;
            background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
            transition: background-image 1s ease-in-out;
        }

        /* BANNER FLUTUANTE INFORMATIVO */
        .floating-banner { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 2px solid var(--gold); padding: 10px 30px; border-radius: 30px; text-align: center; z-index: 200; backdrop-filter: blur(5px); transition: all 0.5s;}
        .floating-banner h1 { font-size: 18px; color: white; margin-bottom: 2px; text-transform: uppercase;}
        .floating-banner p { font-size: 12px; color: var(--gold); font-weight: bold;}

        /* --- BARRA DE TEMPO DE TROCA DE TELA --- */
        .screen-timer { position: absolute; bottom: 0; left: 0; height: 5px; background: var(--gold); width: 0%; transition: width 1s linear; z-index: 300; }

        /* --- ELEMENTOS DO MAPA --- */
        .svg-path { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 10; transition: all 0.5s; }
        .node-icon { font-size: 35px; background: rgba(20,20,20,0.8); width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 3px solid #7f8c8d; box-shadow: 0 5px 15px rgba(0,0,0,0.9); transition: all 0.5s;}
        .node-label { background: rgba(0,0,0,0.9); padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; margin-top: 8px; border: 1px solid #7f8c8d; white-space: nowrap; pointer-events: none; }
        
        .node.castle .node-icon { border: 4px solid var(--gold); background: rgba(241, 196, 15, 0.4); font-size: 50px; box-shadow: 0 0 20px var(--gold); width: 90px; height: 90px;}

        /* --- PLACAS DE AVISO --- */
        .warning-sign {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 8;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #7f8c8d;
            border-left: 3px solid var(--red);
            color: #ecf0f1;
            padding: 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: bold;
            text-align: center;
            width: 100px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .warning-sign span {
            display: block;
            color: var(--gold);
            font-size: 10px;
            margin-bottom: 3px;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
        }

        /* AVATARES DOS COLABORADORES */
        .player-token { position: absolute; transform: translate(-50%, -100%); z-index: 15; transition: all 1.5s ease-in-out; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .player-token:hover { z-index: 50; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        
        .player-token .icon { 
            font-size: 45px; background: #fff; width: 70px; height: 70px; border-radius: 50%; 
            border: 4px solid var(--green); display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.9); animation: float 3s ease-in-out infinite; overflow: hidden; 
        }
        .player-token .icon img { width: 100%; height: 100%; object-fit: cover; }
        .player-token .bubble { background: white; color: black; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 10px; border: 2px solid black; margin-bottom: 5px; white-space: nowrap; pointer-events: none; text-align: center;}

        #tooltip { position: fixed; display: none; background: rgba(15, 20, 25, 0.95); border: 1px solid var(--gold); padding: 15px; border-radius: 8px; color: white; font-size: 13px; z-index: 1000; pointer-events: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); min-width: 150px; }
        #tooltip h4 { color: var(--gold); margin-bottom: 5px; font-size: 14px;}
        #tooltip hr { border-color: #444; margin: 8px 0; }
        
        #loader { text-align:center; color: var(--gold); font-size: 12px; margin-top: 10px; font-weight: bold; background: #222; padding: 5px; border-radius: 5px; display: none;}
        .error-msg { color: #e74c3c !important; border: 1px solid #e74c3c; }
        .success-msg { color: #2ecc71 !important; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
            <h3>🎖️ Ranking do Dia</h3>
            <div id="avatar-list" style="overflow-y: auto; flex: 1; padding-right: 5px;"></div>
        </div>

        <div class="panel">
            <h3>📈 Somatório da Equipe</h3>
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: #bdc3c7;">
                <span>Vendido Hoje:</span>
                <span id="score-team-txt" style="color: var(--gold); font-weight: bold;">0 PTS</span>
            </div>
            <div id="loader"></div>
        </div>

        <div class="controls">
            <input type="text" id="nomeConsultor" placeholder="Nome do Vendedor">
            <select id="avatarConsultor">
                <option value="<img src='https://i.postimg.cc/8cnQDWzF/Whats-App-Image-2026-02-13-at-14-01-47.jpg'>">Foto Santos 📸</option>
                <option value="🪖">Soldado 🪖</option>
                <option value="🥷">Agente 🥷</option>
                <option value="🚁">Piloto 🚁</option>
                <option value="🛡️">Guerreiro 🛡️</option>
            </select>
            <input type="number" id="valorVenda" placeholder="R$ Valor Vendido">
            <button onclick="registrarVenda()">Lançar Venda (Resgate)</button>
        </div>
    </aside>

    <main class="map-viewport" id="viewport">
        <div class="floating-banner" id="main-banner">
            <h1 id="banner-title">🔥 ZONA DE GUERRA (FASE 1)</h1>
            <p>A cada 1.000 PTS = R$ 20,00 e Nova Fase!</p>
        </div>

        <div class="map-content" id="map-content">
            <svg class="svg-path" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M 10 90 L 30 75 L 50 60 L 70 50 L 85 35 L 90 15" fill="transparent" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="2, 2" vector-effect="non-scaling-stroke" opacity="0.6" />
            </svg>
            <div id="nodes-container"></div>
        </div>
        <div class="screen-timer" id="screen-timer"></div>
    </main>
    <div id="tooltip"></div>

<script>
    // =====================================================================
    // ⚠️ COLOQUE AQUI A SUA URL DO APP DA WEB (GOOGLE APPS SCRIPT)
    const API_URL = "https://script.google.com/macros/s/AKfycbx7pA6OD7MDhRbi6JROMXmV1zD5zPj-f48XBSIgfzXnS-NJUY5euexue_aOyXgpGjXc/exec"; 
    // =====================================================================

    const TAMANHO_FASE = 1000;

    const PLACAS_AVISO = [
        { pts: 100, texto: "CORRE ATRÁS DE PROSPECTAR CLIENTES." },
        { pts: 300, texto: "VC PRECISA MELHORAR SUAS TÉCNICAS DE FECHAMENTO!" },
        { pts: 500, texto: "ESTUDE SOBRE CONTORNO DE OBJEÇÕES!" },
        { pts: 900, texto: "FALTA POUCO... VAI DESISTIR AGORA?" }
    ];

    const TEMAS = {
        impar: { bg: "url('https://i.postimg.cc/Nfsx9QGF/paisagem-de-zona-de-guerra-com-destruicao-apocaliptica-23-2150985648.avif')", titulo: "🔥 ZONA DE GUERRA", nos: [ { pts: 0, icone: "⛺", nome: "BASE" }, { pts: 200, icone: "🪙", nome: "TRINCHEIRA" }, { pts: 400, icone: "💰", nome: "CAIXA FORTE" }, { pts: 600, icone: "🧳", nome: "MALETA" }, { pts: 800, icone: "💵", nome: "BUNKER" }, { pts: 1000, icone: "🚁", nome: "RESGATE (R$ 20)" } ] },
        par: { bg: "url('https://i.postimg.cc/Qtfb8PL1/97b6b-9nhmeq.jpg')", titulo: "🏰 REINO MEDIEVAL", nos: [ { pts: 0, icone: "⛩️", nome: "ALDEIA" }, { pts: 200, icone: "🏆", nome: "MERCADO" }, { pts: 400, icone: "⛓️", nome: "MINA" }, { pts: 600, icone: "🐉", nome: "DRAGÃO" }, { pts: 800, icone: "🪙", nome: "TESOURO" }, { pts: 1000, icone: "👑", nome: "CONQUISTA (R$ 20)" } ] }
    };

    const caminhoBase = [ { x: 10, y: 90 }, { x: 30, y: 75 }, { x: 50, y: 60 }, { x: 70, y: 50 }, { x: 85, y: 35 }, { x: 90, y: 15 } ];

    const mapaAvatares = {
        "SANTOS": "<img src='https://i.postimg.cc/8cnQDWzF/Whats-App-Image-2026-02-13-at-14-01-47.jpg'>",
        "SILVA": "🪖", "COSTA": "🥷", "LIMA": "🚁"
    };

    let jogadores = [];
    let faseExibicaoAtual = 1; 
    let maxFaseAlcancada = 1;
    let timerLoop = 0;

    const tooltip = document.getElementById('tooltip');
    function showTooltip(e, titulo, descricao) {
        let safeDescricao = descricao.replace(/<img[^>]*>/g, "📸 Foto ");
        tooltip.innerHTML = `<h4>${titulo}</h4><hr><div>${safeDescricao}</div>`;
        tooltip.style.display = 'block'; tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY + 15) + 'px';
    }
    function hideTooltip() { tooltip.style.display = 'none'; }
    document.addEventListener('mousemove', (e) => { if(tooltip.style.display === 'block') { tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY + 15) + 'px'; } });

    function getPosicaoNoMapa(pontosNaFase) {
        if (pontosNaFase <= 0) return { x: caminhoBase[0].x, y: caminhoBase[0].y };
        if (pontosNaFase >= TAMANHO_FASE) return { x: caminhoBase[5].x, y: caminhoBase[5].y };
        for (let i = 0; i < 5; i++) {
            let atualPts = i * 200; let proxPts = (i+1) * 200;
            if (pontosNaFase >= atualPts && pontosNaFase < proxPts) {
                let perc = (pontosNaFase - atualPts) / 200;
                return { x: caminhoBase[i].x + ((caminhoBase[i+1].x - caminhoBase[i].x) * perc), y: caminhoBase[i].y + ((caminhoBase[i+1].y - caminhoBase[i].y) * perc) };
            }
        }
    }

    // --- LÓGICA DE DADOS (AGORA PUXANDO APENAS VALORES DE HOJE E ARREDONDANDO) ---
    async function carregarDadosDoServidor() {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';

        if(API_URL === "SUA_URL_AQUI" || API_URL.trim() === "") {
            loader.className = 'error-msg'; loader.innerText = "COLE SUA API_URL NO CÓDIGO!";
            
            // Dados Mockados apenas para visualização se não tiver API
            jogadores = [
                { nome: "SILVA", avatar: "🪖", pontosTotais: 350 }, 
                { nome: "SANTOS", avatar: mapaAvatares["SANTOS"], pontosTotais: 1400 } 
            ];
            processarEstatisticasEquipe();
            return;
        }

        loader.className = ''; loader.innerText = "Carregando vendas de hoje...";
        
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Erro de Rede");
            
            const jsonResposta = await response.json();
            const vendas = jsonResposta.vendasHoje || [];
            
            let somaVendedoresTemp = {};
            
            // PEGA A DATA DE HOJE
            let dataHojeLocal = new Date();
            dataHojeLocal.setHours(0,0,0,0);
            
            vendas.forEach(venda => {
                let nome = venda[0] ? venda[0].toString().toUpperCase().trim() : null;
                
                // PUXA OS VALORES INTEIROS (Sem centavos. Ex: 599,90 -> 599)
                let valor = Math.floor(parseFloat(venda[1]) || 0); 
                
                let dataVendaStr = venda[2] ? venda[2].toString().trim() : "";
                
                if(!nome || valor <= 0) return; // Ignora linhas em branco ou vazias

                // CONVERSOR DE DATAS PARA COMPARAÇÃO
                let dataVendaObj = new Date(0); // Data antiga caso dê erro
                if(dataVendaStr !== "") {
                    if (dataVendaStr.includes('/')) {
                        let partes = dataVendaStr.split('/');
                        if (partes.length === 3) { dataVendaObj = new Date(partes[2], partes[1] - 1, partes[0]); }
                    } else if (dataVendaStr.includes('-')) {
                        let baseData = dataVendaStr.split('T')[0];
                        let partes = baseData.split('-');
                        if (partes.length === 3) { dataVendaObj = new Date(partes[0], partes[1] - 1, partes[2]); }
                    }
                }
                dataVendaObj.setHours(0,0,0,0);
                
                // VERIFICA SE A DATA DA VENDA É IGUAL OU MAIOR QUE A DATA DE HOJE
                if(dataVendaObj.getTime() >= dataHojeLocal.getTime()) {
                    if(!somaVendedoresTemp[nome]) somaVendedoresTemp[nome] = 0;
                    somaVendedoresTemp[nome] += valor;
                }
            });

            jogadores = Object.keys(somaVendedoresTemp).map(nomeConsultor => {
                return {
                    nome: nomeConsultor,
                    avatar: mapaAvatares[nomeConsultor] || "👤",
                    pontosTotais: somaVendedoresTemp[nomeConsultor]
                };
            });
            
            loader.className = 'success-msg'; loader.innerText = "Atualizado!";

        } catch (e) {
            console.error(e);
            loader.className = 'error-msg'; loader.innerText = "ERRO: Verifique a conexão.";
        } finally {
            processarEstatisticasEquipe();
            // Some com a notificação após 3 segundos
            setTimeout(() => { loader.style.display = 'none'; }, 3000);
        }
    }

    function processarEstatisticasEquipe() {
        maxFaseAlcancada = 1;
        jogadores.forEach(jog => {
            let f = Math.floor(Math.max(0, jog.pontosTotais - 0.01) / TAMANHO_FASE) + 1;
            jog.fase = f;
            jog.pontosNaFaseAtual = jog.pontosTotais - ((f.toFixed(0) - 1) * TAMANHO_FASE);
            if(f > maxFaseAlcancada) maxFaseAlcancada = f;
        });
        atualizarPainelLateral();
        renderizarMapaAtual();
    }

    function atualizarPainelLateral() {
        const lista = document.getElementById('avatar-list');
        lista.innerHTML = '';
        let equipeTotal = 0;

        jogadores.sort((a,b) => b.pontosTotais - a.pontosTotais).forEach(jog => {
            equipeTotal += jog.pontosTotais;
            let progressoPercent = Math.min((jog.pontosNaFaseAtual / TAMANHO_FASE) * 100, 100);
            let recompensasPagas = (jog.fase - 1) * 20;

            lista.innerHTML += `
                <div class="avatar-item" onmouseenter="showTooltip(event, '${jog.nome}', 'Total Geral (Hoje): ${jog.pontosTotais} PTS<br>Recompensa Acumulada: <b>R$ ${recompensasPagas},00</b><br><br>Faltam: ${TAMANHO_FASE - jog.pontosNaFaseAtual} pts p/ próxima meta')" onmouseleave="hideTooltip()">
                    <div class="avatar-icon">${jog.avatar}</div>
                    <div class="avatar-info">
                        <div style="display:flex; justify-content: space-between; color: white;">
                            <b>${jog.nome}</b> <span style="color:var(--gold); font-weight:bold;">FASE ${jog.fase}</span>
                        </div>
                        <div style="font-size: 10px; color: #aaa;">${jog.pontosNaFaseAtual.toFixed(0)} / ${TAMANHO_FASE}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressoPercent}%;"></div></div>
                    </div>
                </div>`;
        });
        document.getElementById('score-team-txt').innerText = `${equipeTotal} PTS`;
    }

    function renderizarMapaAtual() {
        const mapContent = document.getElementById('map-content');
        const containerNos = document.getElementById('nodes-container');
        containerNos.innerHTML = ''; 
        document.querySelectorAll('.player-token').forEach(el => el.remove()); 

        const tema = (faseExibicaoAtual % 2 === 0) ? TEMAS.par : TEMAS.impar;
        mapContent.style.backgroundImage = tema.bg;
        document.getElementById('banner-title').innerText = `${tema.titulo} (FASE ${faseExibicaoAtual})`;

        // Desenha Marcos Principais
        tema.nos.forEach((noConfig, index) => {
            const pos = caminhoBase[index];
            const isCastle = index === 5; 
            const el = document.createElement('div');
            el.className = `node unlocked ${isCastle ? 'castle' : ''}`;
            el.style.left = `${pos.x}%`; el.style.top = `${pos.y}%`;
            el.innerHTML = `<div class="node-icon">${noConfig.icone}</div><div class="node-label">${noConfig.nome}</div>`;
            containerNos.appendChild(el);
        });

        // Desenha Placas
        PLACAS_AVISO.forEach(placa => {
            const pos = getPosicaoNoMapa(placa.pts);
            const el = document.createElement('div');
            el.className = 'warning-sign';
            el.style.left = `${pos.x}%`; el.style.top = `${pos.y}%`;
            el.innerHTML = `<span>⚠️ ${placa.pts} PTS</span>${placa.texto}`;
            containerNos.appendChild(el);
        });

        // Desenha Jogadores
        jogadores.forEach(jog => {
            if(jog.fase !== faseExibicaoAtual) return;
            let pos = getPosicaoNoMapa(jog.pontosNaFaseAtual);
            let randomX = (Math.random() * 40) - 20; let randomY = (Math.random() * 40) - 20;

            const token = document.createElement('div');
            token.className = 'player-token';
            token.style.left = `calc(${pos.x}% + ${randomX}px)`; token.style.top = `calc(${pos.y}% + ${randomY}px)`;
            token.onmouseenter = (e) => showTooltip(e, `Consultor: ${jog.nome}`, `Total Geral: ${jog.pontosTotais}<br>Progresso Fase ${jog.fase}: <b>${jog.pontosNaFaseAtual}</b>`);
            token.onmouseleave = hideTooltip;
            token.innerHTML = `<div class="bubble">${jog.nome} (${jog.pontosNaFaseAtual})</div><div class="icon" style="animation-delay: ${Math.random()}s;">${jog.avatar}</div>`;
            mapContent.appendChild(token);
        });
    }

    function loopTelas() {
        if(maxFaseAlcancada > 1) {
            timerLoop += 1; 
            document.getElementById('screen-timer').style.width = `${(timerLoop / 8) * 100}%`;
            if(timerLoop >= 8) { 
                timerLoop = 0; document.getElementById('screen-timer').style.width = '0%';
                faseExibicaoAtual++;
                if(faseExibicaoAtual > maxFaseAlcancada) faseExibicaoAtual = 1; 
                renderizarMapaAtual();
            }
        } else {
            faseExibicaoAtual = 1; document.getElementById('screen-timer').style.width = '100%';
        }
    }
    setInterval(loopTelas, 1000); 

    async function registrarVenda() {
        const nome = document.getElementById('nomeConsultor').value.toUpperCase().trim();
        const avatar = document.getElementById('avatarConsultor').value;
        const valor = parseFloat(document.getElementById('valorVenda').value);

        if (!nome || isNaN(valor) || valor <= 0) { alert("Preencha o nome e um valor válido!"); return; }

        mapaAvatares[nome] = avatar;
        if(API_URL === "SUA_URL_AQUI") { alert("Configure a API_URL para salvar as vendas."); return; }

        const loader = document.getElementById('loader');
        loader.style.display = 'block';
        loader.innerText = "Salvando...";
        try {
            await fetch(API_URL, { method: "POST", body: JSON.stringify({ vendedor: nome, valor: valor }) });
            document.getElementById('valorVenda').value = '';
            // Recarrega todos os dados
            carregarDadosDoServidor(); 
        } catch(e) {
            alert("Erro ao gravar venda.");
        }
    }

    // Inicialização ao abrir a página
    window.onload = () => {
        renderizarMapaAtual(); 
        carregarDadosDoServidor(); 
        // REMOVIDA A ATUALIZAÇÃO AUTOMÁTICA EM BACKGROUND CONFORME SOLICITADO
    };

</script>
</body>
</html>
